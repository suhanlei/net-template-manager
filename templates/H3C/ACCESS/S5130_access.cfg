#
# H3C S5130 接入交换机配置
# Version: 1.0.0
#

 sysname Acc-SW01

 # 上联接口
 interface GigabitEthernet1/0/1
  description UPLINK-to-Agg-SW01
  port link-type trunk
  port trunk permit vlan 20 30
  speed 1000
  duplex full

 # 接入接口
 interface range GigabitEthernet1/0/2 to GigabitEthernet1/0/24
  port link-type access
  port access vlan 20
  stp edged-port enable
  poe enable

 # 端口安全
 interface range GigabitEthernet1/0/2 to GigabitEthernet1/0/24
  port-security max-mac-count 2
  port-security mode autolearn

 # STP
 stp mode rstp
 stp priority 8192
