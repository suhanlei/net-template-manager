!
! Cisco Nexus 9300 核心交换机配置
! Version: 1.0.0
!

hostname N9K-Core01

feature ospf
feature bgp
feature interface-vlan
feature hsrp
feature dhcp

! 管理接口
interface mgmt0
  ip address 10.0.0.11/24
  vrf member management

! VLAN
vlan 10
  name Server-Farm
vlan 20
  name User-Office
vlan 30
  name Guest-WIFI
vlan 100
  name MGMT-VLAN

! SVI接口
interface Vlan10
  ip address 10.10.10.1/24
  hsrp 10
    priority 110
    preempt
    ip 10.10.10.254

interface Vlan20
  ip address 10.20.20.1/24
  hsrp 20
    priority 110
    preempt
    ip 10.20.20.254

! OSPF
router ospf 1
  router-id 10.0.0.11
  network 10.0.0.0 0.0.0.255 area 0
  network 10.10.0.0 0.0.255.255 area 0

! SNMP
snmp-server community public ro
snmp-server community private rw

! NTP
ntp server 10.0.0.100

! SSH
ssh key rsa 2048
line vty
  transport input ssh
